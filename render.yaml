services:
  # Backend Web Service (FastAPI + Uvicorn)
  - type: web
    name: zenith-hotel-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./zenith_hotel.db
      - key: CORS_ORIGINS
        value: '["https://zenith-hotel-frontend.onrender.com"]'

  # Frontend Static Site (React + Vite)
  - type: web
    name: zenith-hotel-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://zenith-hotel-backend.onrender.com
