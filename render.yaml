services:
  # Backend Web Service (FastAPI)
  - type: web
    name: zenith-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python scripts/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./zenith_hotel.db
      - key: CORS_ORIGINS
        value: "*"

  # Frontend Static Site (React + Vite)
  - type: static
    name: zenith-frontend
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://zenith-backend.onrender.com
